<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{TITLE}}</title>
<style>
  :root{--nav:#152238;--ink:#1c2430;--muted:#6a7382;--line:#dfe4ec;--bg:#f4f6fa}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:16px;
        padding:40px 36px;box-shadow:0 18px 48px rgba(21,34,56,.08)}
  .mark{width:52px;height:52px;border-radius:12px;background:var(--nav);color:#fff;display:flex;
        align-items:center;justify-content:center;font-weight:700;font-size:22px;margin-bottom:22px}
  h1{margin:0 0 10px;font-size:26px;line-height:1.25;letter-spacing:-.01em}
  .msg{margin:0 0 6px;color:var(--muted);font-size:16px}
  .hint{margin:22px 0 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
  details{margin-top:18px}
  summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"▸ ";color:#9aa4b4}
  details[open] summary:before{content:"▾ "}
  form{display:grid;gap:10px;margin-top:14px}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fbfcfe}
  input:focus{outline:2px solid rgba(21,34,56,.25);outline-offset:1px;background:#fff}
  button{margin-top:4px;padding:12px 16px;border:0;border-radius:10px;background:var(--nav);color:#fff;
         font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .error{margin:0;color:#b3261e;font-size:14px;min-height:1.2em}
  @media(max-width:520px){.card{padding:30px 22px;border-radius:14px}h1{font-size:22px}}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">К</div>
  <h1>{{TITLE}}</h1>
  <p class="msg">{{MESSAGE}}</p>
  <p class="hint">Если вы сотрудник кафедры и вам нужен доступ – напишите администратору сайта.</p>

  <details id="admin">
    <summary>Вход для администратора</summary>
    <form id="form" autocomplete="on">
      <label for="email">Почта</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="error" role="alert"></p>
      <button id="submit" type="submit">Войти</button>
    </form>
  </details>
</main>
<script>
(function(){
  var form=document.getElementById('form'),
      error=document.getElementById('error'),
      submit=document.getElementById('submit');

  form.addEventListener('submit',async function(event){
    event.preventDefault();
    error.textContent='';
    submit.disabled=true;
    try{
      var response=await fetch('/api/v1/auth/signin',{
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          email:document.getElementById('email').value.trim(),
          password:document.getElementById('password').value
        })
      });
      var data={};
      try{data=await response.json();}catch(_){}
      if(response.ok&&data.access_token){
        try{localStorage.setItem('access_token',data.access_token);}catch(_){}
        location.replace('/');
        return;
      }
      error.textContent=data.error||'Не удалось войти';
    }catch(_){
      error.textContent='Сервер недоступен, попробуйте ещё раз';
    }
    submit.disabled=false;
  });
})();
</script>
</body>
</html>
